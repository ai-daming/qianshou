openapi: 3.1.0
info:
  title: Qianshou Control Plane API
  version: 0.1.0
  description: >-
    Single contract source for the Qianshou control plane (ADR 0001). The
    Go server implements this contract and the web client is generated
    from it. This seed declares the shape only; freezing the full v1
    surface from the TypeScript prototype API is M1-02/M1-03 work.
servers:
  - url: http://127.0.0.1:41727
    description: Local control server
paths:
  /api/status:
    get:
      operationId: getStatus
      summary: Current control-plane status
      responses:
        "200":
          description: Status payload
          content:
            application/json:
              schema:
                type: object
