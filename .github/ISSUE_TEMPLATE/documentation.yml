name: Documentation Delivery
description: 经 PR 落地的仓库文档交付（DELIVERY / DOCUMENTATION）
labels: ["workflow:delivery", "type:documentation"]
body:
  - type: dropdown
    id: rigor
    attributes:
      label: Rigor
      description: 流程严格度：standard 标准交付流程；lite 轻量；high-risk 全部门禁加严。创建时判断一次，后续可通过标签调整。
      options:
        - standard
        - lite
        - high-risk
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: 文档缺口
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: 目标读者与使用场景
  - type: textarea
    id: non-goals
    attributes:
      label: Non-Goals
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] AC-1: ...
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 必须保持一致的事实来源
  - type: textarea
    id: dod
    attributes:
      label: Issue-specific DoD
